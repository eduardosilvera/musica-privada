<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREE MIND EN EL EDEN — EDU F</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0A0A0C;
    --surface: #111115;
    --surface2: #18181F;
    --surface3: #222230;
    --border: rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.11);
    --accent: #7C3AED;
    --accent2: #9D5CF6;
    --glow: rgba(124,58,237,0.3);
    --text: #F0EFF6;
    --text2: #9896A8;
    --text3: #4E4C62;
    --danger: #EF4444;
    --success: #22C55E;
    --warn: #F59E0B;
  }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }
  audio { display:none; }

  /* TOPBAR */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-icon { width:30px; height:30px; border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:15px; }
  .brand-text { line-height:1.2; }
  .brand-title { font-size:13px; font-weight:700; letter-spacing:-0.2px; }
  .brand-sub { font-size:11px; color:var(--text2); }
  .tab-bar { display:flex; gap:3px; background:var(--surface2); border-radius:10px; padding:3px; }
  .tab-btn { padding:6px 13px; border-radius:8px; border:none; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.15s; background:transparent; color:var(--text2); font-family:inherit; }
  .tab-btn.active { background:var(--surface3); color:var(--text); }

  /* MAIN */
  .main { padding:20px; max-width:700px; margin:0 auto; }
  .view { display:none; }
  .view.active { display:block; }

  /* SECTION HEADER */
  .sec-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sec-title { font-size:19px; font-weight:700; letter-spacing:-0.4px; }

  /* SONG ITEMS */
  .song-item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:8px; transition:border-color 0.15s; }
  .song-item:hover { border-color:var(--border2); }
  .song-num { width:26px; height:26px; border-radius:7px; background:var(--surface3); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--text3); flex-shrink:0; }
  .song-info { flex:1; min-width:0; }
  .song-name { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .song-meta { font-size:11px; color:var(--text3); margin-top:2px; }
  .song-actions { display:flex; gap:6px; flex-shrink:0; }

  /* TOKEN ITEMS */
  .token-item { display:flex; align-items:center; gap:8px; padding:10px 13px; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:6px; }
  .token-code { font-family:monospace; font-size:13px; font-weight:700; color:var(--accent2); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; white-space:nowrap; }
  .badge-active { background:rgba(34,197,94,0.12); color:var(--success); }
  .badge-used { background:rgba(239,68,68,0.1); color:var(--danger); }
  .badge-blocked { background:rgba(245,158,11,0.1); color:var(--warn); }

  /* BUTTONS */
  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:9px; border:none; font-size:13px; font-weight:500; cursor:pointer; transition:all 0.15s; font-family:inherit; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:var(--accent2); }
  .btn-secondary { background:var(--surface2); color:var(--text2); border:1px solid var(--border2); }
  .btn-secondary:hover { color:var(--text); }
  .btn-danger { background:rgba(239,68,68,0.08); color:var(--danger); border:1px solid rgba(239,68,68,0.18); }
  .btn-danger:hover { background:rgba(239,68,68,0.15); }
  .btn-sm { padding:7px 13px; font-size:12px; }
  .btn-xs { padding:5px 9px; font-size:11px; border-radius:7px; }
  .btn-full { width:100%; justify-content:center; }

  /* INPUTS */
  .input { width:100%; padding:10px 13px; background:var(--surface2); border:1px solid var(--border2); border-radius:9px; color:var(--text); font-size:13px; font-family:inherit; outline:none; transition:border-color 0.15s; }
  .input:focus { border-color:var(--accent); }
  .input::placeholder { color:var(--text3); }
  label { font-size:12px; color:var(--text2); display:block; margin-bottom:5px; }
  .field { margin-bottom:13px; }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none; align-items:flex-end; justify-content:center; z-index:200; padding:0; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border2); border-radius:20px 20px 0 0; padding:24px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; }
  .modal-handle { width:36px; height:4px; background:var(--surface3); border-radius:2px; margin:0 auto 20px; }
  .modal-title { font-size:16px; font-weight:700; margin-bottom:16px; }
  .modal-footer { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }

  /* CARD */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:14px; }
  .card-label { font-size:11px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:14px; }

  /* PLAYER */
  .player-outer { min-height:100vh; display:flex; flex-direction:column; }
  .player-body { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .player-card { width:100%; max-width:380px; }
  .player-art {
    width:100%; aspect-ratio:1; border-radius:20px;
    background:linear-gradient(135deg,#1a1030 0%,#0f0820 50%,#1a0a2e 100%);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:24px; position:relative; overflow:hidden;
    border:1px solid var(--border2);
  }
  .player-art-inner { text-align:center; z-index:1; }
  .player-art-emoji { font-size:60px; display:block; margin-bottom:8px; }
  .player-art-album { font-size:11px; font-weight:700; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; }
  .player-art::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 30% 40%, rgba(124,58,237,0.3) 0%, transparent 60%),
               radial-gradient(circle at 70% 70%, rgba(157,92,246,0.15) 0%, transparent 50%);
  }
  .player-track { margin-bottom:20px; }
  .player-name { font-size:22px; font-weight:700; letter-spacing:-0.5px; margin-bottom:4px; }
  .player-artist { font-size:14px; color:var(--text2); }
  .player-num { font-size:12px; color:var(--text3); margin-top:2px; }

  .progress-wrap { margin-bottom:6px; cursor:pointer; }
  .progress-bg { background:var(--surface3); border-radius:3px; height:4px; position:relative; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:3px; width:0%; transition:width 0.25s linear; }
  .progress-times { display:flex; justify-content:space-between; font-size:11px; color:var(--text3); margin-bottom:24px; }

  .controls { display:flex; align-items:center; justify-content:center; gap:24px; margin-bottom:12px; }
  .ctrl-btn { border:none; background:none; cursor:pointer; color:var(--text2); display:flex; padding:8px; border-radius:9px; transition:color 0.15s, background 0.15s; }
  .ctrl-btn:hover { color:var(--text); background:var(--surface2); }
  .play-btn { width:58px; height:58px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; transition:transform 0.1s, background 0.15s; box-shadow:0 0 28px var(--glow); }
  .play-btn:hover { background:var(--accent2); transform:scale(1.04); }

  /* GATE */
  .gate-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .gate-card { background:var(--surface); border:1px solid var(--border2); border-radius:20px; padding:32px 24px; max-width:360px; width:100%; text-align:center; }
  .gate-icon { font-size:40px; margin-bottom:16px; }
  .gate-album { font-size:11px; font-weight:700; color:var(--accent2); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
  .gate-title { font-size:20px; font-weight:700; letter-spacing:-0.4px; margin-bottom:6px; }
  .gate-artist { font-size:14px; color:var(--text2); margin-bottom:6px; }
  .gate-warn { font-size:12px; color:var(--text3); margin-bottom:24px; line-height:1.6; }

  /* LOGIN */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card { background:var(--surface); border:1px solid var(--border2); border-radius:20px; padding:32px 24px; max-width:340px; width:100%; text-align:center; }

  /* UTILS */
  .divider { height:1px; background:var(--border); margin:14px 0; }
  .empty { text-align:center; padding:40px 20px; color:var(--text3); font-size:13px; }
  .empty-icon { font-size:28px; margin-bottom:8px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--surface3); border:1px solid var(--border2); padding:11px 18px; border-radius:11px; font-size:13px; transition:transform 0.22s; z-index:300; white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .flex { display:flex; } .items-center { align-items:center; } .justify-between { justify-content:space-between; } .gap-6 { gap:6px; } .gap-8 { gap:8px; }
  .mt-8 { margin-top:8px; } .mt-12 { margin-top:12px; }

  @media(max-width:400px) {
    .main { padding:14px; }
    .topbar { padding:11px 14px; }
    .tab-btn { padding:5px 10px; font-size:11px; }
    .player-name { font-size:19px; }
  }
</style>
</head>
<body>
<audio id="audio-el" preload="none"></audio>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
// ══════ ÁLBUM ══════
const ALBUM = {
  title: 'FREE MIND EN EL EDEN',
  artist: 'EDU F',
  songs: [
    { id:'s1',  name:'Tirados en el jardín',   file:'01%20tirados%20en%20el%20jard%C3%ADn.mp3' },
    { id:'s2',  name:'Dulce dudoso',            file:'02%20dulce%20dudoso.mp3' },
    { id:'s3',  name:'En cada esquina',         file:'03%20en%20cada%20esquina.mp3' },
    { id:'s4',  name:'Conplicacion',            file:'04%20conplicacion.mp3' },
    { id:'s5',  name:'Alucinógeno',             file:'05%20alucin%C3%B3geno.mp3' },
    { id:'s6',  name:'Blue Heart',              file:'06%20blue%20heart.mp3' },
    { id:'s7',  name:'Lima gris sin tu calor',  file:'07%20lima%20gris%20sin%20tu%20calor.mp3' },
    { id:'s8',  name:'GLANGE',                  file:'08%20GLANGE.mp3' },
    { id:'s9',  name:'Entonando en ti',         file:'09%20Entonando%20en%20ti.m4a' },
    { id:'s10', name:'Hoja al viento',          file:'10%20hoja%20al%20viento.m4a' },
    { id:'s11', name:'Joven',                    file:'11%20Joven.m4a' },
    { id:'s12', name:'Esperando',               file:'12%20Esperando.mp3' },
  ]
};
const BASE_URL = 'https://eduardosilvera.github.io/musica-privada/';
function songUrl(song) { return BASE_URL + song.file; }

// ══════ ESTADO ══════
const ADMIN_PASS = 'eduf2024';
const S = {
  loggedIn: load('loggedIn', false),
  tokens: load('tokens', []),
  tab: 'songs',
  tokenModal: null,
  editPassModal: false,
  playing: false,
  currentTime: 0,
  duration: 0,
  // listener
  mode: 'auto', // 'admin' | 'listener' | 'gate'
  listenerToken: null,
  listenerSong: null,
};

function save() {
  ls('tokens', S.tokens);
  ls('loggedIn', S.loggedIn);
}
function ls(k,v) { try{localStorage.setItem('fme_'+k,JSON.stringify(v));}catch(e){} }
function load(k,d) { try{const v=localStorage.getItem('fme_'+k);return v?JSON.parse(v):d;}catch(e){return d;} }
function genId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function genToken() {
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:8},()=>c[Math.floor(Math.random()*c.length)]).join('');
}
function fmtTime(s) {
  if(!s||isNaN(s)) return '0:00';
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}
function toast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}
function copy(txt) { navigator.clipboard.writeText(txt).then(()=>toast('Copiado ✓')); }
function pageUrl() { return location.href.split('?')[0]; }

// ══════ AUDIO ══════
const AUD = document.getElementById('audio-el');
AUD.addEventListener('timeupdate',()=>{
  S.currentTime=AUD.currentTime; S.duration=AUD.duration||0;
  const f=document.getElementById('pf'); const c=document.getElementById('ct'); const d=document.getElementById('dt');
  if(f&&S.duration) f.style.width=(S.currentTime/S.duration*100)+'%';
  if(c) c.textContent=fmtTime(S.currentTime);
  if(d) d.textContent=fmtTime(S.duration);
});
AUD.addEventListener('loadedmetadata',()=>{ S.duration=AUD.duration; const d=document.getElementById('dt'); if(d) d.textContent=fmtTime(S.duration); });
AUD.addEventListener('ended',()=>{
  S.playing=false; updPlay();
  if(S.listenerToken){
    const t=S.tokens.find(x=>x.code===S.listenerToken);
    if(t){t.status='used';t.usedAt=Date.now();save();}
  }
  // mostrar mensaje fin
  const pg=document.getElementById('player-group');
  if(pg) pg.innerHTML=`<div style="text-align:center;padding:20px 0"><div style="font-size:28px;margin-bottom:12px">✅</div><div style="font-size:16px;font-weight:600;margin-bottom:6px">¡Gracias por escuchar!</div><div style="font-size:13px;color:var(--text2)">Este link ya no está disponible.</div></div>`;
});
function togglePlay(){
  if(!AUD.src) return;
  if(S.playing){AUD.pause();S.playing=false;}
  else{AUD.play();S.playing=true;}
  updPlay();
}
function updPlay(){
  const b=document.getElementById('play-icon');
  if(b) b.innerHTML=S.playing?pauseSVG():playSVG();
}
function seek(e){
  const r=e.currentTarget.getBoundingClientRect();
  AUD.currentTime=((e.clientX-r.left)/r.width)*S.duration;
}
function playSVG(){ return `<svg width="24" height="24" viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg>`; }
function pauseSVG(){ return `<svg width="24" height="24" viewBox="0 0 24 24" fill="white"><rect x="5" y="3" width="5" height="18"/><rect x="14" y="3" width="5" height="18"/></svg>`; }
function skipSVG(fwd){ return fwd
  ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="4" x2="19" y2="20"/></svg>`
  : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19,4 9,12 19,20"/><line x1="5" y1="4" x2="5" y2="20"/></svg>`; }

// ══════ RENDER ══════
function render(){
  const root=document.getElementById('root');
  const params=new URLSearchParams(location.search);
  const urlToken=params.get('token');

  if(urlToken){
    root.innerHTML=renderGate(urlToken);
    return;
  }
  if(S.mode==='listener'&&S.listenerSong){
    root.innerHTML=renderPlayer();
    document.getElementById('progress-bar').addEventListener('click',seek);
    return;
  }
  if(!S.loggedIn){ root.innerHTML=renderLogin(); return; }
  root.innerHTML=renderAdmin();
}

// ══════ LOGIN ══════
function renderLogin(){
  return `<div class="login-wrap"><div class="login-card">
    <div style="font-size:36px;margin-bottom:16px">🎵</div>
    <div style="font-size:18px;font-weight:700;margin-bottom:4px">${ALBUM.title}</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:24px">${ALBUM.artist} · Panel de admin</div>
    <div class="field"><input class="input" type="password" id="apass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div id="lerr" style="color:var(--danger);font-size:12px;margin-bottom:10px;display:none">Contraseña incorrecta</div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">Entrar</button>
  </div></div>`;
}
function doLogin(){
  const v=document.getElementById('apass').value;
  if(v===ADMIN_PASS){S.loggedIn=true;save();render();}
  else{document.getElementById('lerr').style.display='block';}
}

// ══════ ADMIN ══════
function renderAdmin(){
  return `<div>
    <div class="topbar">
      <div class="brand">
        <div class="brand-icon">🎵</div>
        <div class="brand-text">
          <div class="brand-title">${ALBUM.title}</div>
          <div class="brand-sub">${ALBUM.artist}</div>
        </div>
      </div>
      <div class="flex items-center gap-8">
        <div class="tab-bar">
          <button class="tab-btn ${S.tab==='songs'?'active':''}" onclick="setTab('songs')">Canciones</button>
          <button class="tab-btn ${S.tab==='tokens'?'active':''}" onclick="setTab('tokens')">Accesos</button>
        </div>
      </div>
    </div>
    <div class="main">
      ${S.tab==='songs'?renderSongs():renderTokens()}
    </div>
  </div>
  ${S.tokenModal?renderTokenModal():''}`;
}

function renderSongs(){
  return `<div class="sec-header"><div class="sec-title">Canciones (${ALBUM.songs.length})</div></div>
  ${ALBUM.songs.map((s,i)=>{
    const active=S.tokens.filter(t=>t.songId===s.id&&t.status==='active').length;
    return `<div class="song-item">
      <div class="song-num">${i+1}</div>
      <div class="song-info">
        <div class="song-name">${s.name}</div>
        <div class="song-meta">${ALBUM.artist}${active?` · <span style="color:var(--success)">${active} acceso${active>1?'s':''} activo${active>1?'s':''}</span>`:''}</div>
      </div>
      <div class="song-actions">
        <button class="btn btn-primary btn-xs" onclick="openToken('${s.id}')">🔑 Link</button>
      </div>
    </div>`;
  }).join('')}`;
}

function renderTokens(){
  const tokens=[...S.tokens].reverse();
  return `<div class="sec-header">
    <div class="sec-title">Accesos</div>
    <button class="btn btn-secondary btn-sm" onclick="clearUsed()">Limpiar usados</button>
  </div>
  ${tokens.length===0?`<div class="empty"><div class="empty-icon">🔑</div><div>Aún no generaste accesos</div></div>`:
  tokens.map(t=>{
    const song=ALBUM.songs.find(s=>s.id===t.songId);
    const badge=t.status==='active'?`<span class="badge badge-active">Activo</span>`:
                t.status==='used'?`<span class="badge badge-used">Usado</span>`:
                `<span class="badge badge-blocked">Bloqueado</span>`;
    return `<div class="token-item">
      <div style="flex:1;min-width:0">
        <div class="flex items-center gap-6" style="margin-bottom:3px">
          <span class="token-code">${t.code}</span>${badge}
        </div>
        <div style="font-size:11px;color:var(--text3)">${song?song.name:'—'} · ${new Date(t.createdAt).toLocaleDateString('es-PE')}</div>
      </div>
      <div class="flex gap-6">
        ${t.status==='active'?`<button class="btn btn-secondary btn-xs" onclick="copyLink('${t.code}')">📋</button>`:''}
        ${t.status==='active'?`<button class="btn btn-danger btn-xs" onclick="blockTok('${t.code}')">🚫</button>`:''}
        ${t.status!=='active'?`<button class="btn btn-secondary btn-xs" onclick="reactivate('${t.code}')">↺</button>`:''}
      </div>
    </div>`;
  }).join('')}`;
}

function renderTokenModal(){
  const song=ALBUM.songs.find(s=>s.id===S.tokenModal);
  if(!song) return '';
  const activos=S.tokens.filter(t=>t.songId===song.id&&t.status==='active');
  return `<div class="modal-overlay open" onclick="if(event.target===this)closeToken()">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">🔑 Acceso — ${song.name}</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:18px;line-height:1.6">
        Cada link es de <strong style="color:var(--text)">un solo uso</strong>. Cuando el oyente termina de escuchar, el link queda inválido automáticamente. Puedes bloquearlo antes si quieres.
      </div>
      <button class="btn btn-primary btn-full" onclick="genToken2('${song.id}')">✨ Generar nuevo link</button>
      ${activos.length>0?`<div class="divider"></div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px">Links activos</div>
      ${activos.map(t=>`<div class="token-item">
        <span class="token-code">${t.code}</span>
        <span class="badge badge-active">Activo</span>
        <button class="btn btn-secondary btn-xs" onclick="copyLink('${t.code}')">📋 Copiar</button>
        <button class="btn btn-danger btn-xs" onclick="blockTok('${t.code}');closeToken()">🚫</button>
      </div>`).join('')}`:''}
      <div class="modal-footer"><button class="btn btn-secondary" onclick="closeToken()">Cerrar</button></div>
    </div>
  </div>`;
}

// ══════ GATE (oyente) ══════
function renderGate(code){
  const token=S.tokens.find(t=>t.code===code);
  if(!token) return errGate('❌','Link inválido','Este link no existe.');
  if(token.status==='blocked') return errGate('🚫','Acceso bloqueado','Este link fue desactivado.');
  if(token.status==='used') return errGate('✅','Ya fue escuchado','Este link era de un solo uso y ya fue utilizado.');
  const song=ALBUM.songs.find(s=>s.id===token.songId);
  if(!song) return errGate('🎵','No disponible','Esta canción ya no está disponible.');
  const num=ALBUM.songs.indexOf(song)+1;
  return `<div class="gate-wrap"><div class="gate-card">
    <div class="gate-icon">🎵</div>
    <div class="gate-album">${ALBUM.title}</div>
    <div class="gate-title">${song.name}</div>
    <div class="gate-artist">${ALBUM.artist} · Track ${num}</div>
    <div class="gate-warn">Este link es de <strong>un solo uso</strong>.<br>Cuando termine la canción el link queda inválido.</div>
    <button class="btn btn-primary btn-full" onclick="startListen('${code}')">▶&nbsp; Escuchar ahora</button>
    <div style="font-size:11px;color:var(--text3);margin-top:12px">Sin opción de descarga</div>
  </div></div>`;
}
function errGate(icon,title,sub){
  return `<div class="gate-wrap"><div class="gate-card">
    <div class="gate-icon">${icon}</div>
    <div class="gate-title">${title}</div>
    <div class="gate-artist" style="margin-top:8px">${sub}</div>
  </div></div>`;
}

// ══════ PLAYER ══════
function renderPlayer(){
  const song=S.listenerSong;
  const num=ALBUM.songs.indexOf(ALBUM.songs.find(s=>s.id===song.id))+1;
  return `<div class="player-outer">
    <div class="topbar">
      <div class="brand"><div class="brand-icon">🎵</div>
        <div class="brand-text"><div class="brand-title">${ALBUM.title}</div><div class="brand-sub">${ALBUM.artist}</div></div>
      </div>
      <span class="badge badge-active" style="font-size:10px">Privado</span>
    </div>
    <div class="player-body">
      <div class="player-card" id="player-group">
        <div class="player-art">
          <div class="player-art-inner">
            <span class="player-art-emoji">🎵</span>
            <span class="player-art-album">${ALBUM.title}</span>
          </div>
        </div>
        <div class="player-track">
          <div class="player-name">${song.name}</div>
          <div class="player-artist">${ALBUM.artist}</div>
          <div class="player-num">Track ${num} de ${ALBUM.songs.length}</div>
        </div>
        <div class="progress-wrap" id="progress-bar">
          <div class="progress-bg"><div class="progress-fill" id="pf"></div></div>
        </div>
        <div class="progress-times"><span id="ct">0:00</span><span id="dt">0:00</span></div>
        <div class="controls">
          <button class="ctrl-btn" onclick="AUD.currentTime=Math.max(0,AUD.currentTime-15)" title="-15s">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1,4 1,10 7,10"/><path d="M3.51,15a9,9,0,1,0,.49-3"/></svg>
          </button>
          <button class="play-btn" onclick="togglePlay()"><span id="play-icon">${playSVG()}</span></button>
          <button class="ctrl-btn" onclick="AUD.currentTime=Math.min(S.duration,AUD.currentTime+15)" title="+15s">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23,4 23,10 17,10"/><path d="M20.49,15a9,9,0,1,1-.49-3"/></svg>
          </button>
        </div>
        <div style="text-align:center;margin-top:16px;font-size:11px;color:var(--text3)">Link de un solo uso · Sin descarga</div>
      </div>
    </div>
  </div>`;
}

// ══════ ACCIONES ══════
function setTab(t){S.tab=t;render();}
function openToken(id){S.tokenModal=id;render();}
function closeToken(){S.tokenModal=null;render();}

function genToken2(songId){
  const code=genToken();
  S.tokens.push({code,songId,status:'active',createdAt:Date.now(),usedAt:null});
  save();
  copyLink(code);
  render();
}
function copyLink(code){
  copy(pageUrl()+'?token='+code);
}
function blockTok(code){
  const t=S.tokens.find(x=>x.code===code);
  if(t){t.status='blocked';save();}
  render(); toast('Acceso bloqueado');
}
function reactivate(code){
  const t=S.tokens.find(x=>x.code===code);
  if(t){t.status='active';save();}
  render(); toast('Acceso reactivado');
}
function clearUsed(){
  S.tokens=S.tokens.filter(t=>t.status!=='used');
  save(); render(); toast('Tokens usados eliminados');
}

function startListen(code){
  const token=S.tokens.find(t=>t.code===code);
  if(!token||token.status!=='active'){render();return;}
  const song=ALBUM.songs.find(s=>s.id===token.songId);
  if(!song){render();return;}
  S.listenerToken=code;
  S.listenerSong=song;
  S.mode='listener';
  AUD.src=songUrl(song);
  AUD.load();
  render();
  setTimeout(()=>{
    const bar=document.getElementById('progress-bar');
    if(bar) bar.addEventListener('click',seek);
    AUD.play().then(()=>{S.playing=true;updPlay();}).catch(()=>{toast('Toca ▶ para escuchar');});
  },300);
}

// deshabilitar descarga
document.addEventListener('contextmenu',e=>{if(e.target===AUD)e.preventDefault();});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s')e.preventDefault();});

// INIT
(function(){
  const params=new URLSearchParams(location.search);
  if(params.get('token')){S.mode='gate';}
  render();
})();
</script>
</body>
